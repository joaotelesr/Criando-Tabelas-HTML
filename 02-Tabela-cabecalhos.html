<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Cabeçalho 2</title>
</head>
<style>
    th, td{
        border:1px solid #1900ff;
    }
    th{
        background: #c5ba45;
        padding: 6px 12px;
    }
</style>

<body>
    <h1>Boletim</h1>
    <table border="1">
        <tr>
            <th scope="col">Aluno</th>
            <th scope="col">Nota</th>
            <th scope="col">Faltas</th>
        </tr>
        <tr>
            <th scope="row">Ana</th>
            <td>9,5</td>
            <td>2</td>
        </tr>
        <tr>
            <td>Bruno</td>
            <td>7,0</td>
            <td>5</td>
        </tr>
    </table>
</body>
</html>
